name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sweetwater_db
          MYSQL_USER: sweetwater_user
          MYSQL_PASSWORD: sweetwater_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli, mbstring
          coverage: none
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
      - name: Wait for MySQL
        run: |
          for i in {1..60}; do
            mysqladmin ping -h 127.0.0.1 -uroot -proot --silent && break
            sleep 1
          done
      - name: Import seed database
        run: |
          mysql -h 127.0.0.1 -usweetwater_user -psweetwater_pass sweetwater_db < docker/sql/sweetwater_test.sql
      - name: Build static site
        env:
          DB_HOST: 127.0.0.1
          DB_USER: sweetwater_user
          DB_PASS: sweetwater_pass
          DB_NAME: sweetwater_db
          DB_PORT: 3306
          APP_ENV: pages
        run: |
          mkdir -p dist/css
          php public/index.php > dist/index.html
          cp -r public/css dist/
          sed -i 's|href="/css/style.css"|href="css/style.css"|' dist/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
