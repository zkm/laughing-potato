name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sweetwater_db
          MYSQL_USER: sweetwater_user
          MYSQL_PASSWORD: sweetwater_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli, mbstring
          coverage: none
          tools: composer

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Wait for MySQL
        run: |
          for i in {1..60}; do
            mysqladmin ping -h 127.0.0.1 -uroot -proot --silent && break
            sleep 1
          done

      - name: Import seed database
        run: |
          mysql -h 127.0.0.1 -usweetwater_user -psweetwater_pass sweetwater_db < docker/sql/sweetwater_test.sql

      - name: Run PHPUnit
        env:
          DB_HOST: 127.0.0.1
          DB_USER: sweetwater_user
          DB_PASS: sweetwater_pass
          DB_NAME: sweetwater_db
          APP_ENV: ci
        run: |
          ./vendor/bin/phpunit --testdox
