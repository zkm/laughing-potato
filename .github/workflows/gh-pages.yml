name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sweetwater_db
          MYSQL_USER: sweetwater_user
          MYSQL_PASSWORD: sweetwater_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli, mbstring
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Wait for MySQL
        run: |
          for i in {1..60}; do
            mysqladmin ping -h 127.0.0.1 -uroot -proot --silent && break
            sleep 1
          done

      - name: Import seed database
        run: |
          mysql -h 127.0.0.1 -usweetwater_user -psweetwater_pass sweetwater_db < docker/sql/sweetwater_test.sql

      - name: Build static site
        env:
          DB_HOST: 127.0.0.1
          DB_USER: sweetwater_user
          DB_PASS: sweetwater_pass
          DB_NAME: sweetwater_db
          APP_ENV: pages
        run: |
          mkdir -p dist/css
          php public/index.php > dist/index.html
          cp -r public/css dist/
          # Fix absolute asset path for GitHub Pages project sites
          sed -i 's|href="/css/style.css"|href="css/style.css"|' dist/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
