version: '3.7'

services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: secretadmin
      MYSQL_DATABASE: sweetwater_db
      MYSQL_USER: sweetwater_user
      MYSQL_PASSWORD: sweetwater_pass
    ports:
      - "9906:3306"
  web:
    build: ./docker
    image: php:8.1-apache
    container_name: php_sweetwater
    depends_on:
      - db
    volumes:
      - ./php/:/var/www/html/
    ports:
      - "8100:80"
    stdin_open: true
    tty: true
